<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 225 50" width="225" height="50">
<!-- 이름 칸: 어두운 바탕 + 가는 사선 무늬 (+ 즐겨찾기면 탁한 주황 줄무늬) + 하얀 테두리 빛 -->
<defs><pattern id="p" width="4.5" height="4.5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="1.6" height="4.5" fill="#5a5d63"/></pattern>
<clipPath id="c"><rect x="6" y="6" width="213" height="38" rx="5"/></clipPath>
<filter id="glow" x="-10%" y="-40%" width="120%" height="180%"><feGaussianBlur stdDeviation="1.6"/></filter></defs>
<rect x="5.5" y="5.5" width="214" height="39" rx="5.5" fill="none" stroke="#fff" stroke-opacity=".4" stroke-width="1.6" filter="url(#glow)"/>
<rect x="6" y="6" width="213" height="38" rx="5" fill="#0c0d0f" fill-opacity=".72"/>

<g clip-path="url(#c)"><rect x="6" y="6" width="213" height="38" fill="url(#p)" fill-opacity=".45"/></g>
<rect x="5.5" y="5.5" width="214" height="39" rx="5.5" fill="none" stroke="#fff" stroke-opacity=".32"/>
</svg>
