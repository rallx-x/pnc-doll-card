<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 225 50" width="225" height="50">
<!-- 즐겨찾기 이름 칸: 반투명 어두운 바탕 + 가는 사선 + 오른쪽 절반의 탁한 주황 빗금 + 위아래로만 옅게 깔리는 주황빛 + 얇고 어두운 주황 테두리 -->
<defs>
<pattern id="p" width="4.5" height="4.5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="1.6" height="4.5" fill="#5a5d63"/></pattern>
<pattern id="po" width="13" height="13" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="13" fill="#b8681c"/></pattern>
<linearGradient id="og" x1="0" y1="0" x2="1" y2="0"><stop offset=".42" stop-color="#fff" stop-opacity="0"/><stop offset=".62" stop-color="#fff" stop-opacity=".42"/><stop offset="1" stop-color="#fff" stop-opacity=".6"/></linearGradient>
<mask id="om" maskUnits="userSpaceOnUse" x="0" y="0" width="225" height="50"><rect x="0" y="11" width="225" height="28" fill="url(#og)"/></mask>
<linearGradient id="hg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff8a1e" stop-opacity=".18"/><stop offset=".5" stop-color="#ff8a1e" stop-opacity=".3"/><stop offset="1" stop-color="#ff8a1e" stop-opacity=".45"/></linearGradient>
<clipPath id="c"><rect x="6" y="6" width="213" height="38" rx="5"/></clipPath>
<filter id="glow" x="-10%" y="-60%" width="120%" height="220%"><feGaussianBlur stdDeviation="1.8"/></filter></defs>
<!-- 위아래 바깥으로만 옅게 깔리는 빛 -->
<g filter="url(#glow)"><rect x="10" y="4" width="205" height="3" fill="url(#hg)"/><rect x="10" y="43" width="205" height="3" fill="url(#hg)"/></g>
<rect x="6" y="6" width="213" height="38" rx="5" fill="#0c0d0f" fill-opacity=".6"/>
<g clip-path="url(#c)">
  <rect x="6" y="6" width="213" height="38" fill="url(#p)" fill-opacity=".38"/>
  <rect x="0" y="0" width="225" height="50" fill="url(#po)" mask="url(#om)"/>
</g>
<rect x="5.6" y="5.6" width="213.8" height="38.8" rx="5.4" fill="none" stroke="#9a5418" stroke-opacity=".85" stroke-width=".8"/>
</svg>
