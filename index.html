<!doctype html>
<html lang="ko" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>소녀전선: 뉴럴 클라우드 인형증</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
/* 카드 글꼴 (OFL 무료 글꼴, assets/fonts) */
@font-face{font-family:"Do Hyeon";src:url("assets/fonts/DoHyeon-Regular.ttf") format("truetype");font-display:swap}
@font-face{font-family:"Share Tech Mono";src:url("assets/fonts/ShareTechMono-Regular.ttf") format("truetype");font-display:swap}

/* ===== 사이트 테마 3가지 (저장 이미지에는 영향 없음) ===== */
:root{
  --accent:#f39a1e; --accent-ink:#1b1206; --gold:#e6cf9a;
  --bg:#121316; --panel:#1b1d22; --panel2:#24272d; --line:#2e3138; --fg:#e9e7e3; --muted:#9b9ea6; --hover:#262930;
  --ui:"Noto Sans KR",system-ui,sans-serif; --mono:"Share Tech Mono",ui-monospace,monospace;
  color-scheme:dark;
}
:root[data-theme="grey"]{--bg:#393c43;--panel:#43464e;--panel2:#4b4f57;--line:#575b64;--fg:#f0efed;--muted:#bcbfc6;--hover:#4d5059;color-scheme:dark}
:root[data-theme="light"]{--bg:#e7e8ea;--panel:#f5f5f6;--panel2:#ebecee;--line:#c9ccd1;--fg:#22252a;--muted:#5f636b;--hover:#e1e2e5;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--ui);font-size:14px;-webkit-text-size-adjust:100%}
.top{display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap;max-width:1500px;margin:0 auto;padding-block:16px 6px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top .brand{display:flex;flex-direction:column;gap:6px}
.top h1{margin:0;font-weight:700;line-height:1.2;display:flex;flex-direction:column}.top h1 .t1{font-size:14px;color:var(--muted);font-weight:500}.top h1 .t2{font-size:22px}
.top .tag{font-family:var(--mono);letter-spacing:.18em;font-size:12px;color:var(--accent)}
.top .tools{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{font:inherit;font-size:13px;background:var(--panel);color:var(--muted);border:0;padding:6px 11px;cursor:pointer;min-height:32px}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:700}
.wrap{max-width:1500px;margin:0 auto;padding-block:10px 32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:18px;align-items:start}
@media (max-width:900px){.wrap{grid-template-columns:1fr}}
.stage{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;min-width:0}
.stage-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap;color:var(--muted);font-size:12px}
.grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
@media (max-width:1200px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (max-width:620px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.slot{position:relative;display:flex;flex-direction:column;gap:6px;touch-action:pan-y}
.slot .cv{border-radius:10px;outline:2px solid transparent;outline-offset:2px;cursor:pointer}
.slot canvas{display:block;width:100%;height:auto}
.slot.sel .cv{outline-color:var(--accent)}
.slot.sel canvas{cursor:grab;touch-action:none}
.slot.dragging{opacity:.35}
.slot.drop-before::before{content:"";position:absolute;left:-7px;top:4%;bottom:12%;width:4px;border-radius:2px;background:var(--accent)}
.sbar{display:flex;justify-content:center;gap:4px}
.sbar button{font:inherit;font-size:12px;line-height:1;min-height:28px;padding:4px 8px;border-radius:6px;border:1px solid var(--line);background:var(--panel2);color:var(--muted);cursor:pointer}
.sbar button:hover{background:var(--hover);color:var(--fg)}
.sbar .mv{cursor:grab;touch-action:none;user-select:none}
.sbar .st[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.add{border:2px dashed var(--line);border-radius:10px;background:transparent;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;aspect-ratio:312/496;margin-bottom:34px;cursor:pointer;font:inherit;min-height:120px}
.add b{font-size:34px;font-weight:400;line-height:1}
.add:hover{border-color:var(--accent);color:var(--accent)}
.hint{color:var(--muted);font-size:12px;margin:12px 0 0;line-height:1.7}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:13px;position:sticky;top:12px}
@media (max-width:900px){.panel{position:static}}
.panel h2{margin:0;font-size:13px;color:var(--muted);font-weight:500;display:flex;justify-content:space-between;align-items:center;gap:8px}
label.f{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--muted)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.inrow{display:flex;gap:6px}
input[type=text],select{width:100%;min-height:42px;background:var(--bg);border:1px solid var(--line);color:var(--fg);border-radius:6px;padding:8px 10px;font:inherit;font-size:15px}
input[type=range]{width:100%;accent-color:var(--accent)}
.pick{display:flex;align-items:center;justify-content:center;min-height:44px;border:1px dashed var(--line);border-radius:6px;cursor:pointer;color:var(--fg)}
.pick:hover{border-color:var(--accent)}
.vh{position:absolute;opacity:0;width:1px;height:1px}
.zoomrow{display:flex;gap:8px;align-items:center}
.zoomrow span{font-family:var(--mono);font-size:12px;color:var(--muted);min-width:44px;text-align:right}
.toggles{display:flex;gap:18px;flex-wrap:wrap}
.cm{display:flex;align-items:center;gap:6px}.cm b{font-weight:500;font-size:15px;color:var(--fg)}.cm input{flex:1;min-width:0}
.tg{display:flex;align-items:center;gap:8px;cursor:pointer;font-size:15px;min-height:36px}
.tg input{width:20px;height:20px;accent-color:var(--gold)}
.note{color:var(--muted);font-size:12px}
.saves{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:13px}
.saves .sub{font-size:12px;color:var(--muted);margin-top:4px}
button.b{font:inherit;border-radius:6px;min-height:46px;padding:10px 12px;border:1px solid var(--line);background:var(--panel2);color:var(--fg);cursor:pointer;text-align:left;display:flex;justify-content:space-between;align-items:center;gap:8px}
button.b small{color:var(--muted);font-size:11px}
button.b:hover:not(:disabled){background:var(--hover)}
button.b.main{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
button.b.main small{color:rgba(27,18,6,.72)}
button.b:disabled{opacity:.4;cursor:not-allowed}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:8px}
button.s{font:inherit;font-size:13px;border-radius:6px;min-height:40px;padding:6px 10px;border:1px solid var(--line);background:var(--panel2);color:var(--fg);cursor:pointer;white-space:nowrap}
button.s:hover:not(:disabled){background:var(--hover)}
button.s:disabled{opacity:.4;cursor:not-allowed}
button:focus-visible,input:focus-visible,select:focus-visible,label:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--panel2);color:var(--fg);border:1px solid var(--line);padding:10px 16px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;z-index:2000}
.toast.on{opacity:1}
footer{max-width:1500px;margin:0 auto;padding-block:0 30px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));color:var(--muted);font-size:11px;line-height:1.8}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}

/* ===== 공지 팝업 (취향픽과 같은 모양, 색은 사이트 테마를 따라감) ===== */
.pn-modal[hidden]{display:none!important}
.pn-modal{position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:16px;color:var(--fg)}
.pn-sheet{background:var(--bg);border:1px solid var(--line);border-radius:8px;width:min(560px,100%);max-height:min(86vh,900px);max-height:min(86dvh,900px);display:flex;flex-direction:column;overflow:hidden}
.pn-head{flex:none;display:flex;align-items:center;justify-content:space-between;padding:12px 16px 8px}
.pn-head h2{margin:0;font-size:16px}
.pn-x{font:inherit;background:none;border:0;font-size:16px;cursor:pointer;color:var(--muted);padding:4px 8px}
.pn-langs{flex:none;display:inline-flex;flex-wrap:wrap;align-self:flex-start;margin:4px 16px 12px;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.pn-seg{font:inherit;background:var(--panel);color:var(--muted);border:0;padding:7px 14px;cursor:pointer;font-size:14px}
.pn-seg+.pn-seg{border-left:1px solid var(--line)}
.pn-seg[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:700}
.pn-body{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;touch-action:pan-y;margin:0 16px 16px;padding:10px 14px;line-height:1.7;background:var(--panel);border-left:3px solid var(--accent);font-size:12px;color:var(--muted)}
.pn-body p{margin:0}
.pn-body hr{border:0;border-top:1px dashed var(--line);margin:10px 0}
.pn-updates summary{cursor:pointer;color:var(--fg);list-style:none;user-select:none}
.pn-updates summary::-webkit-details-marker{display:none}
.pn-updates summary::after{content:" ▾";color:var(--accent)}
.pn-updates[open] summary::after{content:" ▴"}
.pn-updates ul{margin:8px 0 0;padding-left:0;list-style:none}
.pn-updates li{margin:0 0 4px}
.pn-updates .pn-date{color:var(--accent);margin-right:8px;font-variant-numeric:tabular-nums}
.pn-foot{flex:none;border-top:1px solid var(--line);padding:10px 16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.pn-toggle{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);cursor:pointer}
.pn-toggle input{accent-color:var(--accent);width:16px;height:16px}
.pn-ok{font:inherit;border-radius:4px;padding:8px 16px;cursor:pointer;font-size:16px;background:var(--accent);border:1px solid var(--accent);color:var(--accent-ink);font-weight:700}
@media (max-width:560px){.pn-modal{padding:10px}.pn-body{margin:0 10px 10px;padding:8px 10px;font-size:11px;line-height:1.6}.pn-langs{margin:2px 10px 8px}.pn-seg{padding:6px 10px;font-size:12px}}
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <h1><span class="t1" data-i18n="title1">소녀전선: 뉴럴 클라우드</span><span class="t2" data-i18n="title2">인형증 카드</span></h1>
    <span class="tag">OASIS LOCAL STORAGE ARRAY</span>
  </div>
  <div class="tools">
    <div class="seg" role="group" aria-label="language">
      <button type="button" data-lang-btn="ko">한국어</button><button type="button" data-lang-btn="en">English</button><button type="button" data-lang-btn="zh">中文</button><button type="button" data-lang-btn="ja">日本語</button>
    </div>
    <div class="seg" role="group" data-i18n-aria="theme">
      <button type="button" data-theme-btn="light" data-i18n="theme_light">밝음</button><button type="button" data-theme-btn="grey" data-i18n="theme_grey">회색</button><button type="button" data-theme-btn="dark" data-i18n="theme_dark">어두움</button>
    </div>
    <div class="seg"><button type="button" id="pnOpen" data-i18n="notice">공지</button></div>
  </div>
</header>

<main class="wrap">
  <section class="stage" data-i18n-aria="stage">
    <div class="stage-head"><span id="count"></span><span data-i18n="stage_note">즐겨찾기한 카드는 앞쪽에 고정돼요 · 만든 카드는 이 브라우저에 자동 저장돼요</span><button class="s" id="bReset2" type="button" data-i18n="reset">새로 시작</button></div>
    <div class="grid" id="grid"></div>
    <p class="hint" data-i18n-html="hint"></p>
  </section>

  <aside class="panel" data-i18n-aria="edit">
    <h2><span id="editTitle">카드 편집</span>
      <span class="inrow"><button class="s" id="bLeft" type="button" data-i18n-aria="prev">◀</button><button class="s" id="bRight" type="button" data-i18n-aria="next">▶</button></span>
    </h2>
    <label class="pick" for="fImg" data-i18n="add_image">캐릭터 이미지 넣기</label>
    <input class="vh" type="file" id="fImg" accept="image/*">
    <label class="f"><span data-i18n="size">크기</span>
      <span class="zoomrow"><input type="range" id="fZoom" min="20" max="1000" value="100"><span id="zoomVal">100%</span><button class="s" id="bReset" type="button" data-i18n="reset_zoom">원래대로</button></span>
    </label>
    <label class="f"><span data-i18n="name">이름</span> <input type="text" id="fName" maxlength="20" data-i18n-ph="name_ph"></label>
    <div class="row2">
      <label class="f"><span data-i18n="cls">직군</span>
        <select id="fClass">
          <option value="guard" data-i18n="c_guard">수위</option><option value="sniper" data-i18n="c_sniper">사수</option><option value="warrior" data-i18n="c_warrior">전사</option>
          <option value="specialist" data-i18n="c_specialist">해결사</option><option value="medic" data-i18n="c_medic">치료사</option><option value="heart" data-i18n="c_heart">하트</option>
        </select>
      </label>
      <label class="f"><span data-i18n="company">기업</span>
        <select id="fCompany">
          <option value="42lab">42LAB</option><option value="svarog" data-i18n="co_svarog">스바로그</option><option value="ultilife" data-i18n="co_ultilife">얼티라이프</option>
          <option value="uas">UAS</option><option value="entropy" data-i18n="co_entropy">엔트로피</option><option value="cybermedia" data-i18n="co_cybermedia">사이버미디어</option>
          <option value="alternatives" data-i18n="co_alternatives">얼터너티브</option><option value="purifier" data-i18n="co_purifier">정화자</option><option value="" data-i18n="none">없음</option>
        </select>
      </label>
    </div>
    <div class="row2">
      <label class="f"><span data-i18n="power">전투력</span>
        <span class="inrow"><input type="text" id="fPower" inputmode="numeric" maxlength="6" autocomplete="off"><button class="s" id="bRand" type="button" data-i18n="random">랜덤</button></span>
      </label>
      <label class="f"><span data-i18n="engrave">무장각인</span>
        <select id="fEngrave"><option value="-1" data-i18n="none">없음</option><option value="0">0</option><option value="1">I</option><option value="2">II</option><option value="3">III</option></select>
      </label>
    </div>
    <div class="toggles">
      <label class="tg"><input type="checkbox" id="fOath"> <span data-i18n="oath">서약</span></label>
      <label class="tg"><input type="checkbox" id="fFav"> <span data-i18n="fav">즐겨찾기</span></label>
    </div>
    <label class="f"><span data-i18n="comm">커미션 표기</span> <span class="cm"><b>©</b><input type="text" id="fComm" maxlength="40" data-i18n-ph="comm_ph"></span></label>
    <p class="note" data-i18n="spec_note">최고 스펙을 기준으로 제작되었습니다.</p>

    <div class="saves">
      <button class="b" id="bOne" type="button"><span data-i18n="save_one">개별 저장</span> <small data-i18n="save_one_sub">선택한 카드 · PNG</small></button>
      <button class="b" id="bZip" type="button"><span data-i18n="save_zip">개별 전부 저장</span> <small data-i18n="save_zip_sub">카드마다 따로 · ZIP</small></button>
      <button class="b main" id="bList" type="button"><span data-i18n="save_list">나열 저장</span> <small id="listInfo">2장부터</small></button>
      <button class="b" id="bHead" type="button"><span data-i18n="save_head">헤더 저장</span> <small id="headInfo">3:1 · 1줄만</small></button>
      <span class="sub" data-i18n="anim">움직이는 저장 (서약 카드)</span>
      <div class="duo"><button class="s" id="bGif" type="button">GIF</button><button class="s" id="bMp4" type="button">MP4</button></div>
    </div>
  </aside>
</main>
<footer id="credit"></footer>
<div class="toast" id="toast" role="status"></div>

<!-- 공지 창 -->
<div class="pn-modal" id="pnPop" hidden>
  <div class="pn-sheet" role="dialog" aria-modal="true" aria-labelledby="pnTitle">
    <div class="pn-head"><h2 id="pnTitle">공지</h2><button class="pn-x" id="pnClose" type="button" aria-label="닫기">✕</button></div>
    <div class="pn-langs" role="group" aria-label="language">
      <button type="button" class="pn-seg" data-lang="ko">한국어</button><button type="button" class="pn-seg" data-lang="en">English</button><button type="button" class="pn-seg" data-lang="zh">中文</button><button type="button" class="pn-seg" data-lang="ja">日本語</button>
    </div>
    <div class="pn-body" id="pnBody"></div>
    <div class="pn-foot">
      <label class="pn-toggle"><input type="checkbox" id="pnHide"><span id="pnHideLabel">다음부터 보지 않기</span></label>
      <button class="pn-ok" id="pnOk" type="button">확인</button>
    </div>
  </div>
</div>

<script>
/* ======================================================================
   설정
   ====================================================================== */
// (출처 줄 CREDIT 은 아래 언어 설정에서 만듦)
const MAX_CARDS = 12;
const NAME_FONT = '"HYHeadLine-Medium","HY헤드라인M","HYHeadLine M","Do Hyeon",sans-serif';
const NUM_FONT  = '"Share Tech Mono",monospace';

/* 카드 치수: 기본 카드(플라스틱 판) 256×440, 서약 테두리는 그 바깥에 한 겹 */
const CW=256, CH=440, PAD=28;
const FRAME={x:-9,y:-9,w:CW+18,h:CH+18};   // 서약 테두리: 흰 직사각형 테두리 + 크림색 테두리를 카드 위에 케이스처럼 겹침
const TILE_W=CW+PAD*2, TILE_H=CH+PAD*2;
const IMG_R={x:9,y:19,w:238.5,h:415};         // 그림 영역 (게임 일반 카드 기준)
const SCREEN_SCALE=2, EXPORT_SCALE=2;
const LOOP=2.4;                                // 반짝임 한 바퀴(초) — GIF·MP4 이음새 없이 반복

const A='assets/';
const SRC={
  plate:'svg/plate.svg', mask:'svg/card_mask.svg', limit:'svg/limit_on.svg', star:'svg/star.svg',
  engOn:'svg/engrave_on.svg', engOff:'svg/engrave_off.svg', name:'svg/name_box.svg', nameFav:'svg/name_box_fav.svg',
  power:'svg/power_icon.svg', oathFrame:'svg/oath_frame.svg', oathWhite:'svg/oath_frame_white.svg', oathBadge:'svg/oath_badge.svg',
  eng1:'engrave/engrave_1.png', eng2:'engrave/engrave_2.png', eng3:'engrave/engrave_3.png',
  listBg:'bg/herolist_bg.png', title:'bg/title_oasis_storage.png', code:'bg/code_text.png', squares:'bg/side_squares.png',
  guard:'class/guard.png', sniper:'class/sniper.png', warrior:'class/warrior.png', specialist:'class/specialist.png', medic:'class/medic.png', heartSvg:'svg/heart.svg',
  '42lab':'company/42lab.png', svarog:'company/svarog.png', ultilife:'company/ultilife.png', uas:'company/uas.png',
  entropy:'company/entropy.png', cybermedia:'company/cybermedia.png', alternatives:'company/alternatives.png', purifier:'company/purifier.png'
};
const IMG={};
const reduceMotion=matchMedia('(prefers-reduced-motion: reduce)').matches;
const $=id=>document.getElementById(id);

function off(w,h){const c=document.createElement('canvas');c.width=Math.max(1,Math.round(w));c.height=Math.max(1,Math.round(h));return c}
function raster(img,w,h){const c=off(w,h);c.getContext('2d').drawImage(img,0,0,c.width,c.height);return c}   // SVG → 큰 비트맵
function tint(img,color){const c=off(img.width,img.height),x=c.getContext('2d');x.drawImage(img,0,0);x.globalCompositeOperation='source-in';x.fillStyle=color;x.fillRect(0,0,c.width,c.height);return c}
function rr(x,a,b,w,h,r){x.beginPath();x.moveTo(a+r,b);x.arcTo(a+w,b,a+w,b+h,r);x.arcTo(a+w,b+h,a,b+h,r);x.arcTo(a,b+h,a,b,r);x.arcTo(a,b,a+w,b,r);x.closePath()}

/* ======================================================================
   카드 데이터 — 배열 순서가 곧 화면·저장 순서 (즐겨찾기 묶음이 항상 앞)
   ====================================================================== */
let uid=0;
function makeSparks(seed){const r=rand(seed);
  const outer=Array.from({length:5},(_,i)=>({side:i%3,t:r(),ph:r()*6.283,k:1+Math.floor(r()*2),s:.6+r()*.45}));
  // 아래에서 위로 떠오르는 금가루: 별무리처럼 몇 군데 뭉쳐서 (무리 + 듬성듬성 흩어진 것)
  const gauss=()=>(r()+r()+r()-1.5)/1.5;
  const clusters=Array.from({length:4},()=>({cx:30+r()*196,cy:400+r()*30,sx:14+r()*16,sy:8+r()*8,off:r()}));
  const rise=[];
  clusters.forEach(c=>{for(let i=0;i<34;i++)rise.push({x:c.cx+gauss()*c.sx,y0:c.cy+gauss()*c.sy,dist:70+r()*120,off:(c.off+r()*.35)%1,k:1,s:r()<.85?.4+r()*.7:1.1+r()*.8,drift:(r()-.5)*12})});
  for(let i=0;i<40;i++)rise.push({x:14+r()*226,y0:395+r()*40,dist:50+r()*130,off:r(),k:1,s:.35+r()*.8,drift:(r()-.5)*10});
  const twinkle=Array.from({length:40},()=>({x:12+r()*230,y:360+r()*72,ph:r()*6.283,k:1+Math.floor(r()*3),s:.4+r()*.9})); // 아래쪽 제자리 반짝임
  const badge=Array.from({length:16},()=>{const a=r()*6.283,d=21+r()*9;return{x:32.75+Math.cos(a)*d,y:93+Math.sin(a)*d*.85,ph:r()*6.283,k:1+Math.floor(r()*3),s:.5+r()*.9}}); // 마크 주변 제자리 반짝
  return{outer,rise,badge,twinkle};}
// 새 카드는 직군·무장각인·전투력을 랜덤으로 (하트·없음 포함). 자동 저장에서 불러온 카드는 저장된 값 그대로
const CLASSES=['guard','sniper','warrior','specialist','medic','heart'],pick=a=>a[Math.floor(Math.random()*a.length)];
function randPower(){const len=1+Math.floor(Math.random()*6);let v=String(1+Math.floor(Math.random()*9));for(let i=1;i<len;i++)v+=Math.floor(Math.random()*10);return v}
function newCard(o={}){const id=uid++;return Object.assign({id,img:null,zoom:100,ox:0,oy:0,name:tr('default_name'),cls:pick(CLASSES),company:'42lab',power:randPower(),engrave:pick([-1,0,1,2,3]),oath:false,fav:false,comm:'',fx:makeSparks(id*7919+13)},o)}
const cards=[newCard({name:'스에',oath:true,fav:true,company:'svarog'}),newCard({name:'페르시카·집도',company:'cybermedia'}),newCard({name:'드 레이시',company:'uas'})];
let selId=cards[0].id;
const selCard=()=>cards.find(c=>c.id===selId)||cards[0];
const favCount=()=>cards.filter(c=>c.fav).length;

/* 순서 규칙: 즐겨찾기끼리/일반끼리만 자리 바꿈. 다른 묶음 쪽에 놓으면 경계 자리로 */
function moveCard(card,targetIndex){
  const from=cards.indexOf(card);cards.splice(from,1);
  const fc=cards.filter(c=>c.fav).length;
  let t=Math.max(0,Math.min(targetIndex,cards.length));

function setFav(card,on){card.fav=on;const i=cards.indexOf(card);cards.splice(i,1);const fc=cards.filter(c=>c.fav).length;cards.splice(fc,0,card)} // 켜면 즐겨찾기 맨 끝, 끄면 일반 맨 앞

function sparkAlpha(k,ph,t){return t==null?null:Math.max(0,Math.sin(2*Math.PI*k*t/LOOP+ph))}
function drawCross(x,cx,cy,size,a){
  x.save();x.globalAlpha=a;
  const g=x.createRadialGradient(cx,cy,0,cx,cy,size*.9);g.addColorStop(0,'rgba(255,255,255,.95)');g.addColorStop(.3,'rgba(255,246,222,.5)');g.addColorStop(1,'rgba(255,240,210,0)');
  x.fillStyle=g;x.beginPath();x.arc(cx,cy,size*.9,0,7);x.fill();
  const ray=(w,h)=>{x.beginPath();x.moveTo(cx-w,cy);x.quadraticCurveTo(cx,cy-h*.07,cx+w,cy);x.quadraticCurveTo(cx,cy+h*.07,cx-w,cy);x.fill()};
  x.fillStyle='rgba(255,255,255,.95)';ray(size*2.1,size*1.4);
  x.save();x.translate(cx,cy);x.rotate(Math.PI/2);x.translate(-cx,-cy);ray(size*1.35,size*1.2);x.restore();
  x.restore();
}
function fitFont(x,text,maxW,size,min,family){let s=size;x.font=`${s}px ${family}`;while(x.measureText(text).width>maxW&&s>min){s-=.5;x.font=`${s}px ${family}`}return s}
function spaced(x,text,X,Y,sp,align){ // 글자 사이 간격 직접 조절
  const ws=[...text].map(ch=>x.measureText(ch).width);const total=ws.reduce((a,b)=>a+b,0)+sp*(ws.length-1);
  let cx=align==='right'?X-total:X;x.textAlign='left';[...text].forEach((ch,i)=>{x.fillText(ch,cx,Y);cx+=ws[i]+sp});
}

function drawCard(x,d,t,opt={}){

  {const xr=R.x+R.w,sl=2.6;x.fillStyle='#f7931e';x.beginPath();x.moveTo(bx,by+sl);x.lineTo(xr,by);x.lineTo(xr,by+bh);x.lineTo(bx,by+bh-sl);x.closePath();x.fill()}

  {const P=10,S=3,O=off((R.w+P*2)*S,(R.h+P*2)*S),ox=O.getContext('2d');ox.fillStyle='#000';ox.fillRect(0,0,O.width,O.height);
   ox.globalCompositeOperation='destination-out';ox.drawImage(IMG.maskR,P*S,P*S,R.w*S,R.h*S);

   x.save();x.lineWidth=.8;x.strokeStyle='rgba(20,22,26,.35)';rr(x,R.x+.4,R.y+.4,R.w-.8,R.h-.8,4);x.stroke();

  // 막대 빛이 오른쪽 플라스틱 판까지 옅은 주황으로 물듦 — 판 모양 밖으로는 안 나감, 위아래 끝은 흐리게

   tc.fillStyle=hg;tc.fillRect(0,0,CW-tx,th);

  // 4) 직군 아이콘
  x.fillStyle='rgba(30,32,36,.7)';rr(x,12,22,41.5,41.5,6);x.fill();
  const ic=IMG[d.cls];if(ic){const s=27/Math.max(ic.width,ic.height);x.drawImage(ic,32.75-ic.width*s/2,42.75-ic.height*s/2,ic.width*s,ic.height*s)}

    x.save();x.shadowColor='rgba(255,230,170,.85)';x.shadowBlur=8;x.drawImage(IMG.badgeR,bx2-bw2/2,by2-bh2/2,bw2,bh2);x.restore()}

  // 6) LIMIT UP + 돌파 6칸 (겹치지 않게, 사이에 옅은 세로줄)
  x.save();x.fillStyle='rgba(66,70,77,.88)';x.font='700 11.5px "Noto Sans KR",sans-serif';x.textAlign='right';x.letterSpacing='0.6px';x.fillText('LIMIT UP',245,33);x.restore();
  const LW=19.5,c0=128-26/97*LW,cw=(247-c0)/6;   // 첫 아이콘 위쪽 마름모의 왼쪽 꼭짓점 = 위쪽 홈 가운데(카드 정가운데 128)
  
  for(let i=0;i<6;i++){const w=LW,h=w*100/97;x.drawImage(IMG.limitR,c0+cw*i,40.7+(17-h)/2,w,h)}

  if(d.engrave>0){x.drawImage(IMG.engOnR,54.5-EB/2,268-EB/2+eo,EB,EB);const n=IMG['eng'+d.engrave],k=40/n.height;x.drawImage(n,54.5-n.width*k/2+3.5*k,268-n.height*k/2+3.5*k,n.width*k,n.height*k)}
  else if(d.engrave===0) x.drawImage(IMG.engOffR,54.5-EB/2,268-EB/2+eo,EB,EB);   // 0 = 빈 마름모, 없음(-1) = 아무것도 안 그림

  for(let i=0;i<5;i++)x.drawImage(IMG.starR,22+i*22.6,314,26,26);
  x.drawImage(IMG.powerR,36.4-22.85,359.5-22.85,45.7,45.7);
  x.save();x.shadowColor='rgba(0,0,0,.3)';x.shadowBlur=1.5;x.fillStyle='#c3c7cd';x.font=`32px ${NUM_FONT}`;spaced(x,String(d.power||''),50.5,371,-2.8,'left');
  x.fillStyle='#f7931e';x.shadowColor='rgba(0,0,0,.28)';x.font=`86px ${NUM_FONT}`;spaced(x,'70',242,376,-9,'right');x.restore();

  // 9) 이름 칸 + 이름 (이름 칸 아래로 그림이 살짝 보이는 띠)
  x.drawImage(d.fav?IMG.nameFavR:IMG.nameR,15-6*226/213,383-6*38.5/38,225*226/213,50*38.5/38);   // 이름 칸 양쪽 여백 똑같이 (판 가장자리에서 15씩)
  x.save();x.textBaseline='middle';x.textAlign='left';fitFont(x,d.name,205,35,12,NAME_FONT);x.lineJoin='round';x.lineWidth=2;x.strokeStyle='rgba(0,0,0,.55)';x.strokeText(d.name,23,403);x.fillStyle='#e6e8eb';x.fillText(d.name,23,403);x.restore();
  // 8. 서약 카드: 금가루가 이름 칸 위까지 덮이게


  // 10) 서약 테두리 (기본 카드 바깥에 한 겹)

  // 11) 서약 반짝임: 아래 금가루는 위로 증발하듯 떠오르고, 마크 주변은 제자리 반짝, 바깥 십자 빛은 가끔
  if(d.oath&&opt.sparkle!==false){

    d.fx.badge.forEach(p=>{const a=reduceMotion?.7:Math.max(0,Math.sin(2*Math.PI*p.k*u+p.ph));if(a<.08)return;

      const pos=s.side===0?[PAD+CW+2,PAD+24+s.t*120]:s.side===1?[PAD-2,PAD+120+s.t*200]:[PAD+CW+2,PAD+210+s.t*170];drawCross(x,pos[0],pos[1],15*s.s,a)});

const grid=$('grid');let slots=[];
function build(){
  grid.innerHTML='';
  slots=cards.map((d,idx)=>{
    const s=document.createElement('div');s.className='slot'+(d.id===selId?' sel':'');s.dataset.id=d.id;
    const cv=document.createElement('div');cv.className='cv';
    const c=off(TILE_W*SCREEN_SCALE,TILE_H*SCREEN_SCALE);c.setAttribute('aria-label',tr('card_aria',{name:d.name}));cv.append(c);
    const bar=document.createElement('div');bar.className='sbar';
    const h=document.createElement('button');h.type='button';h.className='mv';h.textContent=tr('move');h.setAttribute('aria-label',tr('move_aria'));
    const st=document.createElement('button');st.type='button';st.className='st';st.textContent='★';st.setAttribute('aria-label',tr('fav'));st.setAttribute('aria-pressed',String(d.fav));
    st.onclick=e=>{e.stopPropagation();setFav(d,!d.fav);selId=d.id;build();fill()};
    const del=document.createElement('button');del.type='button';del.textContent='✕';del.setAttribute('aria-label',tr('del_aria'));
    del.onclick=e=>{e.stopPropagation();if(cards.length===1){toast(tr('min_one'));return}cards.splice(cards.indexOf(d),1);if(selId===d.id)selId=cards[Math.min(idx,cards.length-1)].id;build();fill()};
    bar.append(h,st,del);
    // 그림 옮기기·크기
    const pts=new Map();let start=null;const snap=()=>({p:[...pts.values()].map(q=>({...q})),ox:d.ox,oy:d.oy,zoom:d.zoom});
    c.addEventListener('pointerdown',e=>{if(selId!==d.id){selId=d.id;build();fill();return}c.setPointerCapture(e.pointerId);pts.set(e.pointerId,{x:e.clientX,y:e.clientY});start=snap()});
    c.addEventListener('pointermove',e=>{if(!pts.has(e.pointerId)||!d.img)return;pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
      const k=TILE_W/c.getBoundingClientRect().width,p=[...pts.values()];
      if(p.length===1&&start.p.length===1){d.ox=start.ox+(p[0].x-start.p[0].x)*k;d.oy=start.oy+(p[0].y-start.p[0].y)*k}
      else if(p.length>=2&&start.p.length>=2){const d0=Math.hypot(start.p[0].x-start.p[1].x,start.p[0].y-start.p[1].y),d1=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y);setZoom(start.zoom*d1/Math.max(d0,1))}});
    const end=e=>{pts.delete(e.pointerId);start=snap()};c.addEventListener('pointerup',end);c.addEventListener('pointercancel',end);
    c.addEventListener('wheel',e=>{if(selId!==d.id||!d.img)return;e.preventDefault();setZoom(d.zoom*Math.pow(1.1,-e.deltaY/100))},{passive:false});
    // 카드 순서 옮기기 (⠿ 이동 끌기)
    h.addEventListener('pointerdown',e=>startDrag(e,d,s));
    s.append(cv,bar);grid.appendChild(s);return{c,d};
  });
  if(cards.length<MAX_CARDS){const add=document.createElement('button');add.className='add';add.type='button';add.innerHTML='<b>+</b>'+tr('add_card');
    add.onclick=()=>{const n=newCard({name:tr('new_card')});cards.push(n);selId=n.id;build();fill()};grid.appendChild(add)}
  const rows=Math.ceil(cards.length/6);
  $('count').textContent=tr('count',{n:cards.length,m:MAX_CARDS,r:rows});
  $('bList').disabled=cards.length<2;$('bZip').disabled=cards.length<2;
  $('listInfo').textContent=cards.length<2?tr('list_min'):tr('list_wide',{r:rows});
  $('bHead').disabled=cards.length<2||rows>1;$('headInfo').textContent=cards.length<2?tr('list_min'):(rows>1?tr('head_only'):tr('head_info'));
}
let drag=null;
function startDrag(e,d,el){
  e.preventDefault();e.stopPropagation();el.classList.add('dragging');drag={d,el,target:null};
  const move=ev=>{grid.querySelectorAll('.drop-before').forEach(n=>n.classList.remove('drop-before'));
    const under=document.elementFromPoint(ev.clientX,ev.clientY)?.closest('.slot,.add');drag.target=null;
    if(!under)return;const slotsEl=[...grid.querySelectorAll('.slot')];
    if(under.classList.contains('add')){drag.target=cards.length;return}
    const r=under.getBoundingClientRect(),i=slotsEl.indexOf(under),after=ev.clientX>r.left+r.width/2;
    drag.target=i+(after?1:0);const mark=slotsEl[drag.target];if(mark&&mark!==el)mark.classList.add('drop-before')};
  const up=()=>{removeEventListener('pointermove',move);removeEventListener('pointerup',up);removeEventListener('pointercancel',up);
    el.classList.remove('dragging');if(drag.target!=null){const from=cards.indexOf(d);let t=drag.target;if(t>from)t--;moveCard(d,t)}drag=null;build();fill()};
  addEventListener('pointermove',move);addEventListener('pointerup',up);addEventListener('pointercancel',up);
}
function frame(ts){const t=(ts/1000)%LOOP;slots.forEach(({c,d})=>{const x=c.getContext('2d');x.setTransform(SCREEN_SCALE,0,0,SCREEN_SCALE,0,0);x.clearRect(0,0,TILE_W,TILE_H);drawCard(x,d,t)});requestAnimationFrame(frame)}

function commText(v){v=(v||'').trim();return v?'© '+v:''}
function cardCanvas(d,scale,t=null,bg=null){ // 개별: 카드 + 아래 투명 여백에 출처 (커미션 표기를 쓰면 한 줄 늘어남)
  // 출처 글자는 카드(서약이면 테두리) 밑변에서 살짝만 띄워 붙이고, 그 아래로는 잘라냄
  const cm=commText(d.comm),lines=cm?[cm,CREDIT]:[CREDIT],y0=PAD+CH+(d.oath?17:11),H=y0+(lines.length-1)*12+5,c=off(TILE_W*scale,H*scale),x=c.getContext('2d');x.scale(scale,scale);
  if(bg){x.fillStyle=bg;x.fillRect(0,0,TILE_W,H)}
  drawCard(x,d,t,{placeholder:false});
  x.textAlign='center';x.lineWidth=2.5;x.strokeStyle='rgba(20,22,26,.75)';x.fillStyle='rgba(235,237,240,.95)';
  lines.forEach((L,i)=>{let f=8.5;x.font=`500 ${f}px "Noto Sans KR",sans-serif`;while(x.measureText(L).width>TILE_W-12&&f>6){f-=.25;x.font=`500 ${f}px "Noto Sans KR",sans-serif`}x.strokeText(L,TILE_W/2,y0+i*12);x.fillText(L,TILE_W/2,y0+i*12)});
  return c;
}
function listCanvas(mode='wide'){
  // wide  : 16:9 (게임 목록 화면 비율, 위쪽 UI 바는 뺌). 2줄이 꽉 차는 크기로 카드 크기를 정하고, 1줄일 땐 같은 크기로 위쪽에 두어 아래가 조금 남음
  // header: 3:1 헤더 (1줄 = 6장 이하만)
  const n=cards.length,rows=Math.ceil(n/6),W=3000,side=110,top=170,bottom=130,GAP=.15*CW;   // 카드 사이 = 카드 폭의 15% (게임과 같음)
  let H,s;
  if(mode==='header'){H=W/3;s=Math.min((W-side*2)/(CW*6+GAP*5),(H-top-bottom+20)/CH)}
  else{H=Math.round(W*9/16);s=Math.min((W-side*2)/(CW*6+GAP*5),(H-top-bottom)/(CH*2+GAP))}
  const c=off(W,H),x=c.getContext('2d');
  const bg=IMG.listBg,bs=Math.max(W/bg.width,H/bg.height);x.drawImage(bg,(W-bg.width*bs)/2,(H-bg.height*bs)/2,bg.width*bs,bg.height*bs);
  x.fillStyle='rgba(205,209,214,.35)';x.fillRect(0,0,W,H);
  const ts=1.6;x.globalAlpha=.9;x.drawImage(IMG.titleD,70,48,IMG.title.width*ts,IMG.title.height*ts);   // 게임처럼 진하게
  x.globalAlpha=.8;x.drawImage(IMG.codeD,84,48+IMG.title.height*ts+40,IMG.code.width*1.15,IMG.code.height*1.15);
  const sq=IMG.squaresD,sqs=1.8,sy=(H-sq.height*sqs)/2;x.globalAlpha=.6;   // 양옆 한 세트씩
  x.drawImage(sq,26,sy,sq.width*sqs,sq.height*sqs);x.drawImage(sq,W-26-sq.width*sqs,sy,sq.width*sqs,sq.height*sqs);x.globalAlpha=1;
  const cw=CW*s,ch=CH*s,g=GAP*s,avail=H-top-bottom,blockH=rows*ch+(rows-1)*g;
  const areaTop=mode==='header'?top+(avail-ch)/2-10:(rows===1?top+(avail-ch)*.3:top+(avail-blockH)/2);   // 1줄(16:9)은 살짝 위로 → 아래가 조금 남음
  for(let r=0;r<rows;r++){const inRow=Math.min(6,n-r*6),x0=(W-(inRow*cw+(inRow-1)*g))/2;
    for(let k=0;k<inRow;k++){x.save();x.translate(x0+k*(cw+g)-PAD*s,areaTop+r*(ch+g)-PAD*s);x.scale(s,s);drawCard(x,cards[r*6+k],null,{placeholder:false});x.restore()}}
  // 출처: 커미션 표기(카드마다 쓴 것을 겹치지 않게 모음) 한 줄 + 선본/제작자 한 줄
  const cms=[...new Set(cards.map(c=>(c.comm||'').trim()).filter(Boolean))],lines=cms.length?['© '+cms.join(' · '),CREDIT]:[CREDIT];
  x.textAlign='right';x.fillStyle='rgba(60,64,70,.85)';
  lines.forEach((L,i)=>{let f=26;x.font=`500 ${f}px "Noto Sans KR",sans-serif`;while(x.measureText(L).width>W-140&&f>12){f-=1;x.font=`500 ${f}px "Noto Sans KR",sans-serif`}x.fillText(L,W-70,H-40-(lines.length-1-i)*36)});
  return c;
}
function download(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}

/* 움직이는 저장 — 폰 화면에 꽉 차는 크기(카드 높이 약 900px), 배경을 깔아서 저장 */
const ANIM_SCALE=1.9, ANIM_BG='#25282d', ANIM_FPS=15;
let busy=false;
$('bGif').onclick=async()=>{const d=selCard();if(!d.oath||busy)return;busy=true;
  try{toast(tr('gif_making'));
    const {GIFEncoder,quantize,applyPalette}=await import('https://cdn.jsdelivr.net/npm/gifenc@1.0.3/dist/gifenc.esm.js');
    const frames=Math.round(LOOP*ANIM_FPS),gif=GIFEncoder();let w,h;
    for(let i=0;i<frames;i++){const c=cardCanvas(d,ANIM_SCALE,i/frames*LOOP,ANIM_BG);w=c.width;h=c.height;
      const data=c.getContext('2d').getImageData(0,0,w,h).data,pal=quantize(data,256),idx=applyPalette(data,pal);
      gif.writeFrame(idx,w,h,{palette:pal,delay:Math.round(1000/ANIM_FPS)});if(i%5===4){toast(tr('gif_prog',{p:Math.round((i+1)/frames*100)}));await new Promise(r=>setTimeout(r))}}
    gif.finish();download(new Blob([gif.bytes()],{type:'image/gif'}),`card_${safe(d.name)}.gif`);toast(tr('gif_done'));
  }catch(e){toast(tr('gif_fail'))}finally{busy=false}};
$('bMp4').onclick=async()=>{const d=selCard();if(!d.oath||busy)return;
  if(!window.MediaRecorder){toast(tr('vid_no'));return}
  const types=['video/mp4;codecs=avc1.42E01E','video/mp4','video/webm;codecs=vp9','video/webm'],type=types.find(t=>MediaRecorder.isTypeSupported(t));
  if(!type){toast(tr('vid_no'));return}
  busy=true;toast(tr('vid_making'));
  const c=cardCanvas(d,ANIM_SCALE,0,ANIM_BG),x=c.getContext('2d'),stream=c.captureStream(30),rec=new MediaRecorder(stream,{mimeType:type,videoBitsPerSecond:8e6}),chunks=[];
  rec.ondataavailable=e=>e.data.size&&chunks.push(e.data);
  rec.onstop=()=>{const mp4=type.startsWith('video/mp4');download(new Blob(chunks,{type}),`card_${safe(d.name)}.${mp4?'mp4':'webm'}`);
    toast(mp4?tr('mp4_done'):tr('webm_done'));busy=false};
  rec.start();const t0=performance.now(),dur=LOOP*2*1000;
  (function tick(){const t=((performance.now()-t0)/1000)%LOOP;const f=cardCanvas(d,ANIM_SCALE,t,ANIM_BG);x.clearRect(0,0,c.width,c.height);x.drawImage(f,0,0);
    if(performance.now()-t0<dur)requestAnimationFrame(tick);else rec.stop()})();
};

/* ======================================================================
   자동 저장 — 만든 카드(이미지 포함)를 이 브라우저 안에만 저장 (서버로 안 감)
   ====================================================================== */
const DB_NAME='pnc-card-maker',DB_STORE='state';let dirty=false,dbp=null;
function db(){return dbp||(dbp=new Promise((ok,no)=>{try{const q=indexedDB.open(DB_NAME,1);q.onupgradeneeded=()=>q.result.createObjectStore(DB_STORE);q.onsuccess=()=>ok(q.result);q.onerror=()=>no(q.error)}catch(e){no(e)}}))}
async function dbGet(){const d=await db();return new Promise((ok,no)=>{const q=d.transaction(DB_STORE).objectStore(DB_STORE).get('cards');q.onsuccess=()=>ok(q.result);q.onerror=()=>no(q.error)})}
async function dbPut(v){const d=await db();return new Promise((ok,no)=>{const t=d.transaction(DB_STORE,'readwrite');t.objectStore(DB_STORE).put(v,'cards');t.oncomplete=ok;t.onerror=()=>no(t.error)})}
async function dbClear(){const d=await db();return new Promise(ok=>{const t=d.transaction(DB_STORE,'readwrite');t.objectStore(DB_STORE).delete('cards');t.oncomplete=ok;t.onerror=ok})}
const markDirty=()=>{dirty=true};
['input','change','pointerup','wheel','click'].forEach(ev=>document.addEventListener(ev,markDirty,{passive:true,capture:true}));
setInterval(async()=>{if(!dirty)return;dirty=false;
  try{await dbPut({v:1,sel:cards.findIndex(c=>c.id===selId),cards:cards.map(c=>({name:c.name,cls:c.cls,company:c.company,power:c.power,engrave:c.engrave,oath:c.oath,fav:c.fav,comm:c.comm||'',zoom:c.zoom,ox:c.ox,oy:c.oy,src:c.src||null}))})}catch(e){}},1200);
async function restore(){
  try{const v=await dbGet();if(!v||!v.cards||!v.cards.length)return;
    const list=await Promise.all(v.cards.slice(0,MAX_CARDS).map(o=>new Promise(ok=>{const c=newCard({name:o.name,cls:o.cls,company:o.company,power:o.power,engrave:o.engrave,oath:o.oath,fav:o.fav,comm:o.comm||'',zoom:o.zoom,ox:o.ox,oy:o.oy});
      if(!o.src)return ok(c);const im=new Image();im.onload=()=>{c.img=im;c.src=o.src;ok(c)};im.onerror=()=>ok(c);im.src=o.src})));
    cards.splice(0,cards.length,...list);selId=(cards[v.sel]||cards[0]).id;
  }catch(e){}
}

      ups.forEach(([date,text])=>{const li=document.createElement('li');const dt=document.createElement('span');dt.className='pn-date';dt.textContent=date;li.append(dt,document.createTextNode(text));ul.append(li)});
      d.append(sm,ul);parts.push(document.createElement('hr'),d)}
    $('pnBody').replaceChildren(...parts)}
  function open(){$('pnHide').checked=load().hidden===NOTICE_VERSION;$('pnPop').hidden=false}
  function close(){const o=load();o.hidden=$('pnHide').checked?NOTICE_VERSION:0;save(o);$('pnPop').hidden=true}
  document.querySelectorAll('#pnPop [data-lang]').forEach(b=>b.addEventListener('click',()=>setLang(b.dataset.lang)));   // 공지 언어를 바꾸면 사이트 전체 언어도 같이 바뀜
  $('pnOpen').addEventListener('click',open);$('pnOk').addEventListener('click',close);$('pnClose').addEventListener('click',close);
  $('pnPop').addEventListener('click',e=>{if(e.target.id==='pnPop')close()});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('pnPop').hidden)close()});
  render();if(load().hidden!==NOTICE_VERSION)open();
})();

(async()=>{
  await Promise.all(Object.entries(SRC).map(async([k,v])=>{IMG[k]=await load(v)}));
  const Q=4; // 벡터 그림은 4배 비트맵으로 바꿔서 씀 (저장 2배·움직이는 저장 1.9배보다 큼)
  IMG.plateR=raster(IMG.plate,CW*Q,CH*Q);IMG.maskR=raster(IMG.mask,IMG_R.w*Q,IMG_R.h*Q);
  IMG.limitR=raster(IMG.limit,97*Q,100*Q);IMG.starR=raster(IMG.star,24*Q,24*Q);
  IMG.engOnR=raster(IMG.engOn,76*Q,76*Q);IMG.engOffR=raster(IMG.engOff,76*Q,76*Q);
  IMG.nameR=raster(IMG.name,225*Q,50*Q);IMG.nameFavR=raster(IMG.nameFav,225*Q,50*Q);
  IMG.powerR=raster(IMG.power,256,256);IMG.frameR=raster(IMG.oathFrame,FRAME.w*Q,FRAME.h*Q);IMG.whiteR=raster(IMG.oathWhite,FRAME.w*Q,FRAME.h*Q);
  IMG.heart=raster(IMG.heartSvg,64*Q,60*Q);
  IMG.badgeR=raster(IMG.oathBadge,IMG.oathBadge.width*4,IMG.oathBadge.height*4);
  IMG.titleD=tint(IMG.title,'#3c4046');IMG.codeD=tint(IMG.code,'#3c4046');IMG.squaresD=tint(IMG.squares,'#3c4046');
  for(const k of ['42lab','svarog','ultilife','uas','entropy','cybermedia','alternatives','purifier'])IMG['t_'+k]=tint(IMG[k],'rgb(70,76,84)');
  try{await Promise.all([`86px ${NUM_FONT}`,`27px ${NAME_FONT}`,'500 13px "Noto Sans KR"'].map(f=>document.fonts.load(f,'70스에')))}catch(e){}
  await restore();
  build();fill();requestAnimationFrame(frame);
})().catch(e=>{document.body.insertAdjacentHTML('afterbegin',`<p style="padding:16px;color:#f88">${tr('load_fail',{e})}</p>`)});
</script>
